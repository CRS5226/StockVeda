# Weekly dependency update PRs. Security fixes are raised immediately regardless of this schedule.
# Minor/patch bumps are grouped into one PR per ecosystem; major bumps get their own PR
# because they can break things.
version: 2
updates:
  # Security updates only: pyproject.toml has minimum versions and no lockfile, so version
  # updates would just raise the minimums for every user. A limit of 0 disables version
  # updates but not security updates.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # These majors need code changes, tracked in #67 (Vite 8 + plugin-react 6) and
    # #68 (lightweight-charts v5). Remove each entry once its issue is done.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: lightweight-charts
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The same setup command the README gives contributors, so it can't break unnoticed.
      - name: Install dependencies
        run: uv sync
      # Errors only (syntax errors, undefined names). Style warnings are tracked in #45.
      - name: Lint
        run: uv run --with ruff ruff check backend --select E9,F63,F7,F82
      - name: Tests
        run: uv run --with pytest python -m pytest backend/tests -q

  frontend:
    name: Frontend (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
